<title>Valley Production Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: CRM app shell — dark nav rail + work area; every view is a working screen over one shared demo dataset */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --fg:#171a21; --muted:#5b6170; --line:#dde0e7;
  --nav:#161a22; --nav-fg:#c9cdd6; --nav-active:#ffffff;
  --accent:#7a2445; --accent-fg:#ffffff; --accent-soft:#f4e6ec;
  --ok:#1f7a4a; --ok-soft:#e2f2e9; --warn:#9a6200; --warn-soft:#fbefd8; --info:#1f5fae; --info-soft:#e3edf9;
  --clean:#6a46a8; --clean-soft:#eee7f8; --bad:#b3261e; --bad-soft:#fbe5e3; --off:#6d7280; --off-soft:#eceef2;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1116; --surface:#171a21; --sunk:#1d2129; --fg:#e6e8ee; --muted:#9aa1b0; --line:#2a2f3a;
  --nav:#0a0c10; --nav-fg:#a7adba; --nav-active:#ffffff;
  --accent:#d0638b; --accent-fg:#14070c; --accent-soft:#3a1b27;
  --ok:#5fcf8f; --ok-soft:#173326; --warn:#e8b45a; --warn-soft:#3a2c12; --info:#7fb2f0; --info-soft:#16283f;
  --clean:#b49cf0; --clean-soft:#2a2140; --bad:#f08a80; --bad-soft:#3d1a18; --off:#9aa1b0; --off-soft:#232730; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1116; --surface:#171a21; --sunk:#1d2129; --fg:#e6e8ee; --muted:#9aa1b0; --line:#2a2f3a;
  --nav:#0a0c10; --nav-fg:#a7adba; --nav-active:#ffffff;
  --accent:#d0638b; --accent-fg:#14070c; --accent-soft:#3a1b27;
  --ok:#5fcf8f; --ok-soft:#173326; --warn:#e8b45a; --warn-soft:#3a2c12; --info:#7fb2f0; --info-soft:#16283f;
  --clean:#b49cf0; --clean-soft:#2a2140; --bad:#f08a80; --bad-soft:#3d1a18; --off:#9aa1b0; --off-soft:#232730; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.code{font-family:var(--mono);font-size:.86em;letter-spacing:.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* nav */
.nav{background:var(--nav);color:var(--nav-fg);display:flex;flex-direction:column;gap:18px;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{color:var(--nav-active);font-weight:800;letter-spacing:.02em;font-size:18px}
.brand span{font-size:12px;line-height:1.35}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:6px;display:flex;gap:10px;align-items:center;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--nav-active)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .foot{margin-top:auto;font-size:12px;line-height:1.45;padding:0 6px;display:flex;flex-direction:column;gap:8px}
.nav .foot button{width:auto;padding:6px 10px;border:1px solid rgba(255,255,255,.18);font-size:12.5px}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;padding-inline:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.demo{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.view{padding-inline:24px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 10px;font-weight:700}
.panel h3{font-size:13px;margin:0 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.tile{display:flex;flex-direction:column;gap:2px}
.tile .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{color:var(--muted);font-size:13px}
.tile.alert .n{color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 10px}
/* status chips */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Ready{background:var(--ok-soft);color:var(--ok)}
.st-Pulled{background:var(--warn-soft);color:var(--warn)}
.st-In-use{background:var(--info-soft);color:var(--info)}
.st-Cleaning{background:var(--clean-soft);color:var(--clean)}
.st-Repair{background:var(--bad-soft);color:var(--bad)}
.st-Retired{background:var(--off-soft);color:var(--off)}
.hv{display:inline-flex;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--accent);color:var(--accent-fg)}
.flag{display:inline-flex;font-size:11px;font-weight:800;padding:2px 6px;border-radius:4px;background:var(--bad);color:#fff}
/* bars */
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:9px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type="search"],input[type="text"],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type="search"]{flex:1 1 220px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);z-index:21;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header h2{margin:0;font-size:18px}
.drawer .body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.log li{border-left:2px solid var(--line);padding-left:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
/* scan */
.scanbox{display:flex;flex-direction:column;gap:12px}
.scanfield{display:flex;gap:8px}
.scanfield input{flex:1;font-family:var(--mono);font-size:18px;padding:12px 14px;letter-spacing:.04em}
.itemcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.itemcard.hv-card{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.itemcard h2{margin:0;font-size:20px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 8px}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0;display:flex;flex-wrap:wrap;gap:8px 16px}
legend{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
label.opt{display:inline-flex;gap:6px;align-items:center;font-size:14px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.card b{font-size:14px}
.card .row{gap:4px}
.card .btn{padding:3px 8px;font-size:12.5px}
.pull li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.pull{list-style:none;margin:0;padding:0}
.pull li:first-child{border-top:0}
.gap{color:var(--bad);font-weight:700;font-size:12px}
/* guide + stage */
.stagewrap{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunk);aspect-ratio:16/10;max-width:100%}
.stagewrap canvas{display:block;width:100%;height:100%}
.stage-card{position:absolute;right:10px;top:10px;max-width:min(240px,calc(100% - 20px))}
.stage-card .itemcard{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.loading3d{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:16px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:8px;border-radius:6px;border:1px solid transparent;counter-increment:s;cursor:pointer}
.steps li::before{content:counter(s);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.steps li.on{background:var(--accent-soft);border-color:var(--accent)}
.steps li.on::before{color:var(--accent)}
.steps li.future{opacity:.55}
input[type="range"]{width:100%;accent-color:var(--accent)}
/* labels */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.label{background:#fff;color:#111;border:1px dashed #b9bdc7;border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.label .qr{width:104px;height:104px;display:grid;place-items:center}
.label .qr img,.label .qr canvas{width:104px!important;height:104px!important}
.label b{font-family:var(--mono);font-size:12px}
.label span{font-size:11.5px;line-height:1.3}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
/* responsive */
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;overflow-x:auto;z-index:10}
  .brand span,.nav .foot{display:none}
  .nav ul{flex-direction:row;gap:2px}
  .nav button{padding:7px 9px;white-space:nowrap;font-size:13px}
  .nav button .t{display:none}
  .nav button[aria-current="page"] .t{display:inline}
  .top{position:static;padding-inline:16px}
  .view{padding-inline:16px}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tile .n{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="nav" aria-label="Main">
    <div class="brand"><b>vyntec</b><span>Production Operations<br>prepared for the Valley of Orlando</span></div>
    <ul id="navlist"></ul>
    <div class="foot">
      <span>Demo by vyntec with sample data. Not an official Valley of Orlando page. In the live system this runs inside the Valley's own link.vyntec.co account.</span>
      <button type="button" id="resetBtn">Reset demo data</button>
    </div>
  </nav>
  <div class="main">

        <button type="button" data-crew="Props" aria-pressed="false">Props crew</button>
      </div>

    <main id="view" class="view"></main>
  </div>
</div>
<div id="drawerHost"></div>
<div id="toastHost"></div>

     <div class="row"><button class="btn primary" data-a="pull">Mark pulled</button></div></div>`;
  if(i.status==="Pulled") return `<div class="row"><button class="btn primary" data-a="use">Mark in use (dressed / on stage)</button><button class="btn" data-a="back">Put back, not used</button></div>`;
  if(i.status==="In use") return `<div class="scanbox"><fieldset><legend>Condition on return</legend>
      <label class="opt"><input type="radio" name="${p}cond" value="ok" checked> Good</label>
      <label class="opt"><input type="radio" name="${p}cond" value="clean"> Needs cleaning</label>
      <label class="opt"><input type="radio" name="${p}cond" value="repair"> Needs repair</label></fieldset>

  return `<p class="small muted" style="margin:0">Retired pieces stay on record for history.</p>`;
}
function bindActions(root,i,after){
  root.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{
    const a=b.dataset.a, p=root.id==="drawerHost"?"d":"s";
    if(a==="pull"){
      if(i.high&&!$("#"+p+"lead",root).checked){toast("High-value: the wardrobe lead must sign this mask out");return}
      const pr=S.productions.find(x=>x.id===$("#"+p+"prod",root).value);
      act(i,"Pulled",`Pulled for ${pr?pr.name+" · "+pr.degree:"production"}`+(i.high?" · signed out by the wardrobe lead":""));toast(i.code+" pulled");
    }else if(a==="use"){act(i,"In use","Dressed / on stage");toast(i.code+" in use")}
    else if(a==="back"){act(i,"Ready","Put back unused");toast(i.code+" back on the shelf")}
    else if(a==="return"){
      if(i.high&&!$("#"+p+"photo",root).checked){toast("High-value: take and check the return photo first");return}
      const c=root.querySelector(`input[name="${p}cond"]:checked`).value, note=$("#"+p+"note",root).value.trim();
      const map={ok:["Ready","Good"],clean:["Cleaning","Needs cleaning"],repair:["Repair",note||"Needs repair"]};
      i.condition=map[c][1]; act(i,map[c][0],"Returned · "+map[c][1]+(note&&c!=="repair"?" · "+note:"")+(i.high?" · return photo checked":""));
      toast(map[c][0]==="Ready"?i.code+" returned and ready":i.code+" returned, now "+map[c][0].toLowerCase());
    }else if(a==="ready"){i.condition="Good";act(i,"Ready",(i.status==="Cleaning"?"Cleaned":"Repaired")+", back to ready");toast(i.code+" ready")}
    else if(a==="retire"){act(i,"Retired","Retired from use");toast(i.code+" retired")}
    after();
  }));
}

/* ---------- scan ---------- */
function scan(el){

     <div><span class="small muted">Tap to simulate a scan:</span><div class="quick" style="margin-top:6px">${its.map(i=>`<button type="button" data-scan="${i.code}">${i.code}</button>`).join("")}</div></div>
   </div>

    scanCode=code;

    if(crew!=="All"&&i.dept!==crew){host.innerHTML=`<div class="banner bad">${esc(i.code)} belongs to the ${i.dept} crew. Hand it to them.</div>`;return}
    host.innerHTML=`<div class="itemcard ${i.high?"hv-card":""}" id="scanCard"><div class="code muted">${i.code}</div><h2>${esc(i.name)}</h2><div class="row">${chip(i.status)} ${i.high?'<span class="hv">HIGH VALUE</span>':""} <span class="small muted">${esc(i.location)} · ${i.degree} · size ${esc(i.size)}</span></div>${actionsFor(i,"s")}<button class="btn" data-open="${i.code}" style="align-self:flex-start">Open full record</button></div>`;
    host.id="scanResult";
    const card=$("#scanCard"); card.id="scanHost";
    bindActions(card,i,()=>{show(i.code)});

}

  };

/* ---------- 3D helpers ---------- */
let loops=[];
function stopLoops(){loops.forEach(f=>f());loops=[]}
function have3d(){return typeof THREE!=="undefined"&&THREE.OrbitControls}
function makeRenderer(wrap){
  const r=new THREE.WebGLRenderer({antialias:true,alpha:false});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  wrap.appendChild(r.domElement);
  return r;
}
function sizeTo(wrap,r,cam){const w=wrap.clientWidth,h=wrap.clientHeight||w*.62;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
function hexOf(v){return new THREE.Color(cssv(v)||"#888")}

  let layers=[];

  const cam=new THREE.PerspectiveCamera(35,1.6,.1,100); cam.position.set(0,1.6,6.2);
  const r=makeRenderer(wrap); sizeTo(wrap,r,cam);
  const ctl=new THREE.OrbitControls(cam,r.domElement); ctl.target.set(0,1.15,0); ctl.enablePan=false; ctl.minDistance=3; ctl.maxDistance=9; ctl.autoRotate=!matchMedia("(prefers-reduced-motion: reduce)").matches; ctl.autoRotateSpeed=1.4; ctl.update();
  scene.add(new THREE.HemisphereLight(0xffffff,0x444455,.9)); const dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(3,5,4); scene.add(dl);
  const skin=new THREE.MeshStandardMaterial({color:0xc9b8a6,roughness:.9});
  const add=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o};
  // mannequin
  add(new THREE.CylinderGeometry(.6,.6,.06,32),new THREE.MeshStandardMaterial({color:0x555b66}),0,.03,0);
  add(new THREE.SphereGeometry(.2,24,16),skin,0,2.12,0);
  add(new THREE.CylinderGeometry(.08,.09,.14,16),skin,0,1.92,0);
  add(new THREE.CylinderGeometry(.27,.22,.85,24),skin,0,1.45,0);
  add(new THREE.CylinderGeometry(.22,.2,.25,24),skin,0,.95,0);
  [-.11,.11].forEach(x=>add(new THREE.CylinderGeometry(.075,.065,.82,12),skin,x,.43,0));
  [-.36,.36].forEach(x=>{const a=add(new THREE.CylinderGeometry(.055,.05,.78,12),skin,x,1.42,0);a.rotation.z=x>0?.18:-.18});
  const col={Robe:0x1d1f26,Tunic:0xeeeeea,Coat:0x2a2f48,Cape:0x8e1b2c,Sash:0x2f5fb3,Collar:0xc9a227,Gloves:0xf2f2ee,Footwear:0x6b4a2b,Headpiece:0x7a5a1e,Mask:0xd8c36a};

  let raf=0,alive=true; const tick=()=>{if(!alive)return;ctl.update();r.render(scene,cam);raf=requestAnimationFrame(tick)};tick();

  highlight=code=>{Object.values(meshes).forEach(o=>o.scale.setScalar(1));sel=meshes[code]||null;if(sel)sel.scale.setScalar(1.25)};
  const ray=new THREE.Raycaster(), v=new THREE.Vector2();
  r.domElement.addEventListener("click",e=>{const b=r.domElement.getBoundingClientRect();v.x=((e.clientX-b.left)/b.width)*2-1;v.y=-((e.clientY-b.top)/b.height)*2+1;ray.setFromCamera(v,cam);const hit=ray.intersectObjects(Object.values(meshes),true)[0];if(hit){let o=hit.object;while(o&&!o.userData.code)o=o.parent;if(o){card(o.userData.code);highlight(o.userData.code)}}});
  let raf=0,alive=true,t0=performance.now();const tick=()=>{if(!alive)return;ctl.update();if(sel)sel.rotation.y=(performance.now()-t0)/900;r.render(scene,cam);raf=requestAnimationFrame(tick)};tick();
  const ro=new ResizeObserver(()=>sizeTo(wrap,r,cam)); ro.observe(wrap);
  loops.push(()=>{alive=false;cancelAnimationFrame(raf);ro.disconnect();ctl.dispose();r.dispose()});
  card(placed[0].c);
}

/* ---------- labels ---------- */
function labels(el){
  const its=visible();
  el.innerHTML=`<p class="small muted" style="margin:0">One tag per piece: sewn-in or heat-transfer tags for garments, hard tags for props. Tap a tag to scan it in this demo. On the live system the QR opens the piece's record on the crew member's phone.</p>
  <div class="labels" id="lab">${its.map(i=>`<button type="button" class="label" data-scantag="${i.code}" aria-label="Scan ${i.code}"><div class="qr" id="qr-${i.code}"></div><b>${i.code}</b><span>${esc(i.name)}${i.size&&i.size!=="-"?" · "+esc(i.size):""}<br>${esc(i.location)}</span></button>`).join("")}</div>`;
  if(typeof QRCode!=="undefined") its.forEach(i=>{try{new QRCode(document.getElementById("qr-"+i.code),{text:i.code,width:104,height:104,correctLevel:QRCode.CorrectLevel.M})}catch(e){}});
  else el.querySelectorAll(".qr").forEach(q=>q.textContent="QR");
  el.querySelectorAll("[data-scantag]").forEach(b=>b.onclick=()=>{scanCode=b.dataset.scantag;go("scan")});
}

/* ---------- people helpers ---------- */
const mem=id=>S.members.find(m=>m.id===id);
const first=n=>n;
function award(id,pts,text){const m=mem(id);if(!m)return;m.points+=pts;m.log.unshift({t:Date.now(),text,pts});S.activity.unshift({t:Date.now(),by:"Points",text:`${m.name} +${pts}: ${text}`,code:"",name:""});save()}
const prodName=id=>{const p=S.productions.find(x=>x.id===id);return p?p.name+" · "+p.degree:""};
const sampleNote=`<p class="note">Sample people with invented names. In the live system members are contacts in the Valley's account; volunteers and candidates sign up from forms in the member portal.</p>`;

/* ---------- reunion ---------- */
let rDay=0, rFilter="All", rCode="";
function reunion(el){
  const d=SCHEDULE[rDay];
  el.innerHTML=`<div class="grid g4">
    <div class="panel tile"><span class="n">${S.candidates.filter(c=>c.status==="Checked in"||c.status==="Conferred").length}/${S.candidates.length}</span><span class="l">Candidates checked in</span></div>
    <div class="panel tile"><span class="n">${S.members.filter(m=>m.checkedIn).length}/${S.members.length}</span><span class="l">Volunteers checked in</span></div>
    <div class="panel tile ${S.slots.some(x=>!x.member)?"alert":""}"><span class="n">${S.slots.filter(x=>!x.member).length}</span><span class="l">Cast roles still open</span></div>
    <div class="panel tile"><span class="n">${S.productions.filter(p=>p.stage==="Reset").length}/${S.productions.length}</span><span class="l">Productions reset</span></div></div>
  <div class="grid g32">
    <div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Schedule · run of show</h2>
      <div class="row"><div class="seg" role="group" aria-label="Day">${SCHEDULE.map((x,k)=>`<button type="button" data-day="${k}" aria-pressed="${k===rDay}">${x.day.split(",")[0]}</button>`).join("")}</div>
      <select id="rFilter" aria-label="Who">${["All","Crew","Cast","Candidates"].map(f=>`<option ${f===rFilter?"selected":""}>${f}</option>`).join("")}</select></div></div>
      <p class="small muted" style="margin:6px 0 10px">${esc(d.day)}</p>
      <ul class="pull">${d.items.filter(i=>rFilter==="All"||i[2]===rFilter||i[2]==="All").map(i=>`<li><span class="code" style="min-width:70px">${i[0]}</span><span>${esc(i[1])}</span><span class="pill">${i[2]}</span></li>`).join("")}</ul>
      <p class="note" style="margin-top:12px">In the live system the schedule is a calendar in the Valley's account. Each item can send its own reminder, and crew call times feed the productions board.</p></div>
    <div class="panel scanbox"><h2>Check-in</h2>
      <p class="small muted" style="margin:0">Scan a member's badge or a candidate's confirmation QR, or type the code. Volunteers earn ${POINTS.checkin} points for checking in.</p>
      <form class="scanfield" id="ciForm"><input id="ciIn" autocomplete="off" placeholder="MBR-001 or CND-001" value="${esc(rCode)}" aria-label="Badge code"><button class="btn primary">Check in</button></form>
      <div id="ciOut"></div>
      <h3 style="margin-top:6px">Not checked in yet</h3>
      <div class="quick">${S.members.filter(m=>!m.checkedIn).map(m=>`<button type="button" data-ci="${m.id}">${m.id} ${esc(m.name)}</button>`).join("")}${S.candidates.filter(c=>c.status==="Registered"||c.status==="Confirmed").map(c=>`<button type="button" data-ci="${c.id}">${c.id} ${esc(c.name)}</button>`).join("")}</div>
    </div></div>${sampleNote}`;
  el.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{rDay=+b.dataset.day;render()});
  $("#rFilter").onchange=e=>{rFilter=e.target.value;render()};
  const checkin=code=>{
    code=code.trim().toUpperCase(); rCode="";
    const m=mem(code), c=S.candidates.find(x=>x.id===code);
    if(m){ if(m.checkedIn){$("#ciOut").innerHTML=`<div class="banner ok">${esc(m.name)} is already checked in.</div>`;return}
      m.checkedIn=true; award(m.id,POINTS.checkin,"Checked in at the Fall Reunion"); toast(m.name+" checked in · +"+POINTS.checkin+" points"); render(); return}
    if(c){ if(c.status==="Checked in"||c.status==="Conferred"){$("#ciOut").innerHTML=`<div class="banner ok">${esc(c.name)} is already checked in.</div>`;return}
      if(c.status==="Registered"){$("#ciOut").innerHTML=`<div class="banner bad">${esc(c.name)} is registered but not confirmed. Confirm the registration at the desk first.</div>`;return}
      c.status="Checked in"; save(); toast(c.name+" checked in"); render(); return}
    $("#ciOut").innerHTML=`<div class="banner bad">No member or candidate with code “${esc(code)}”.</div>`;
  };
  $("#ciForm").addEventListener("submit",e=>{e.preventDefault();checkin($("#ciIn").value)});
  el.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>checkin(b.dataset.ci));
}

/* ---------- degree sign-ups (candidates) ---------- */
function candidates(el){
  el.innerHTML=`<div class="kanban" style="grid-template-columns:repeat(4,minmax(200px,1fr))">${CAND_STAGES.map(st=>`<div class="col"><h4>${st}<span>${S.candidates.filter(c=>c.status===st).length}</span></h4>${S.candidates.filter(c=>c.status===st).map(c=>`<div class="card"><b>${esc(c.name)}</b><span class="muted">${esc(c.degrees)} · <span class="code">${c.id}</span></span><span class="small muted">From ${esc(c.from)}</span>${CAND_STAGES.indexOf(st)<3?`<div class="row"><button class="btn" data-cadv="${c.id}">Move to ${CAND_STAGES[CAND_STAGES.indexOf(st)+1]}</button></div>`:""}</div>`).join("")}</div>`).join("")}</div>
  <div class="grid g2">
    <div class="panel"><h2>Degree sign-up form</h2>
      <p class="small muted" style="margin-top:0">What a candidate or his lodge sponsor fills in. In the live system it's a form on the Valley's site that creates the contact and the card above.</p>
      <form id="candForm" class="scanbox">
        <input type="text" id="cName" placeholder="Full name" required aria-label="Full name">
        <select id="cDeg" aria-label="Degrees"><option>4°–14°</option><option>15°–18°</option><option>19°–32°</option><option>4°–32°</option></select>
        <select id="cFrom" aria-label="How did you hear"><option>Website form</option><option>Lodge sponsor (sample)</option><option>Event table</option></select>
        <button class="btn primary" style="align-self:flex-start">Sign up for the Fall Reunion</button>
      </form></div>
    <div class="panel"><h2>What happens next</h2><ul class="pull">
      <li><span class="st st-Ready">Auto</span><span>Welcome email with what to expect (Communications)</span><span></span></li>
      <li><span class="st st-Pulled">Desk</span><span>Registration confirmed; fees through the Valley's own invoices when they choose (not part of this demo)</span><span></span></li>
      <li><span class="st st-In-use">Reunion</span><span>Scanned in at check-in; class lists by degree for the directors</span><span></span></li>
      <li><span class="st st-Cleaning">After</span><span>Marked conferred; the record keeps his degree history</span><span></span></li></ul></div></div>${sampleNote}`;
  el.querySelectorAll("[data-cadv]").forEach(b=>b.onclick=()=>{const c=S.candidates.find(x=>x.id===b.dataset.cadv);c.status=CAND_STAGES[CAND_STAGES.indexOf(c.status)+1];save();render();toast(c.name+" moved to "+c.status)});
  $("#candForm").addEventListener("submit",e=>{e.preventDefault();const n=$("#cName").value.trim();if(!n)return;const id="CND-"+String(S.candidates.length+1).padStart(3,"0");S.candidates.push({id,name:n,degrees:$("#cDeg").value,status:"Registered",from:$("#cFrom").value});save();render();toast(n+" signed up · welcome email queued for approval");S.queue.unshift({t:Date.now(),tpl:"Candidate welcome and what to expect",to:n,ch:"Email"});save()});
}

/* ---------- cast sign-ups ---------- */
function cast(el){
  const castMembers=S.members.filter(m=>m.interest.includes("Cast"));
  el.innerHTML=`<div class="grid g2">${S.productions.map(p=>`<div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(p.name)} · ${p.degree}</h2><span class="pill">${esc(p.stage)}</span></div><p class="small muted" style="margin:4px 0 8px">${esc(p.date)}</p>
     <ul class="pull">${S.slots.filter(sl=>sl.prod===p.id).map(sl=>{const m=sl.member&&mem(sl.member);return `<li><span class="st ${sl.status==="Confirmed"?"st-Ready":sl.status==="Signed up"?"st-Pulled":"st-Repair"}">${sl.status}</span><span><b>${esc(sl.role)}</b><br>${m?`<span class="small">${esc(m.name)} <span class="code muted">${m.id}</span></span>`:`<select data-pick-slot="${sl.id}" aria-label="Sign up a member for ${esc(sl.role)}"><option value="">Sign up a member…</option>${castMembers.map(c=>`<option value="${c.id}">${esc(c.name)} · ${c.points} pts</option>`).join("")}</select>`}</span>${sl.status==="Signed up"?`<button class="btn" data-confirm="${sl.id}">Confirm</button>`:sl.status==="Confirmed"?`<button class="btn" data-release="${sl.id}">Release</button>`:"<span></span>"}</li>`}).join("")}</ul></div>`).join("")}</div>
   <p class="note">Members sign up for open roles from the member portal; the degree director confirms. Confirmed cast get the cast confirmation message and their costume is pulled to their size. Serving earns ${POINTS.cast} volunteer points when the production is returned.</p>${sampleNote}`;
  el.querySelectorAll("[data-pick-slot]").forEach(s=>s.onchange=()=>{if(!s.value)return;const sl=S.slots.find(x=>x.id===s.dataset.pickSlot);sl.member=s.value;sl.status="Signed up";save();render();toast(mem(s.value).name+" signed up for "+sl.role)});
  el.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=()=>{const sl=S.slots.find(x=>x.id===b.dataset.confirm);sl.status="Confirmed";S.queue.unshift({t:Date.now(),tpl:"Cast confirmation",to:mem(sl.member).name,ch:"Email"});save();render();toast("Confirmed · cast confirmation queued for approval")});
  el.querySelectorAll("[data-release]").forEach(b=>b.onclick=()=>{const sl=S.slots.find(x=>x.id===b.dataset.release);sl.member=null;sl.status="Open";save();render();toast("Role reopened")});
}

/* ---------- volunteer points ---------- */
let pSel=null;
function points(el){
  const ranked=[...S.members].sort((a,b)=>b.points-a.points);
  const sel=mem(pSel)||ranked[0]; pSel=sel.id;
  const lvl=p=>p>=60?"Gold":p>=30?"Silver":"Bronze";
  el.innerHTML=`<div class="grid g32">
   <div class="panel"><h2>Leaderboard</h2><div class="tablewrap" style="border:0"><table style="min-width:0"><thead><tr><th>#</th><th>Member</th><th>Serves as</th><th>Level</th><th style="text-align:right">Points</th></tr></thead><tbody>${ranked.map((m,k)=>`<tr data-psel="${m.id}" style="${m.id===sel.id?"background:var(--accent-soft)":""}"><td class="muted">${k+1}</td><td><b>${esc(m.name)}</b> <span class="code muted">${m.id}</span>${m.checkedIn?' <span class="st st-Ready">Here</span>':""}</td><td class="small">${m.interest.join(", ")}</td><td>${lvl(m.points)}</td><td style="text-align:right;font-variant-numeric:tabular-nums"><b>${m.points}</b></td></tr>`).join("")}</tbody></table></div></div>
   <div class="panel scanbox"><h2>${esc(sel.name)} · ${sel.points} points · ${lvl(sel.points)}</h2>
     <form id="awardForm" class="row"><select id="aWhy" aria-label="Reason">${[["Crew shift","crew"],["Rehearsal","rehearsal"],["Served in a cast role","cast"]].map(([l,k])=>`<option value="${k}">${l} (+${POINTS[k]})</option>`).join("")}</select><button class="btn primary">Award points</button></form>
     <ul class="log">${sel.log.slice(0,10).map(l=>`<li><time>${when(l.t)}</time> · <b>+${l.pts}</b> ${esc(l.text)}</li>`).join("")}</ul></div></div>
  <div class="panel"><h2>Point rules (sample values)</h2><ul class="pull">
    <li><span class="code">+${POINTS.cast}</span><span>Served in a cast role (added automatically when the production is returned)</span><span></span></li>
    <li><span class="code">+${POINTS.crew}</span><span>Wardrobe or props crew shift</span><span></span></li>
    <li><span class="code">+${POINTS.checkin}</span><span>Checked in as a reunion volunteer (automatic at check-in)</span><span></span></li>
    <li><span class="code">+${POINTS.rehearsal}</span><span>Attended a rehearsal</span><span></span></li></ul>
    <p class="note" style="margin-top:10px">The Valley sets the real values and levels. In the live system points are fields on each member's contact, added by workflows; officers see the leaderboard on their dashboard.</p></div>${sampleNote}`;
  el.querySelectorAll("[data-psel]").forEach(r=>r.onclick=()=>{pSel=r.dataset.psel;render()});
  $("#awardForm").addEventListener("submit",e=>{e.preventDefault();const k=$("#aWhy").value;award(sel.id,POINTS[k],$("#aWhy").selectedOptions[0].textContent.replace(/ \(\+\d+\)$/,""));render();toast(sel.name+" +"+POINTS[k]+" points")});
}

/* ---------- communications ---------- */
let mSel="cast-confirm";
function audience(t){
  if(t.id==="cast-confirm") return S.slots.filter(x=>x.status==="Confirmed").map(x=>({m:mem(x.member),x}));
  if(t.id==="rehearsal") return S.slots.filter(x=>x.member&&["P3","P4"].includes(x.prod)).map(x=>({m:mem(x.member),x}));
  if(t.id==="crew-call") return S.members.filter(m=>m.interest.some(i=>i.includes("crew"))).map(m=>({m}));
  if(t.id==="cand-welcome") return S.candidates.filter(c=>c.status==="Registered"||c.status==="Confirmed").map(c=>({c}));
  return S.members.filter(m=>m.checkedIn||S.slots.some(x=>x.member===m.id&&x.status==="Confirmed")).map(m=>({m}));
}
function fill(t,a){
  const p=a.x&&S.productions.find(y=>y.id===a.x.prod);
  const name=a.m?a.m.name:a.c.name;
  const earned=a.m?a.m.log.filter(l=>Date.now()-l.t<864e5*7).reduce((s,l)=>s+l.pts,0):0;
  return t.body.replace("{first}",first(name)).replace("{role}",a.x?a.x.role:"").replace("{degree}",p?p.degree:"").replace("{date}",p?p.date.replace(" (sample)",""):"").replace("{call}",p&&p.date.startsWith("Sat")?"6:30 AM":"7:00 AM").replace("{degrees}",a.c?a.c.degrees:"").replace("{pts}",earned).replace("{total}",a.m?a.m.points:"");
}
function messages(el){
  const t=TEMPLATES.find(x=>x.id===mSel), aud=audience(t), ex=aud[0];
  el.innerHTML=`<div class="grid g32">
    <div class="panel"><h2>Message templates</h2><ul class="pull">${TEMPLATES.map(x=>`<li><span class="pill">${x.ch}</span><span><button class="btn" style="padding:2px 8px;${x.id===mSel?"border-color:var(--accent)":""}" data-tpl="${x.id}">${esc(x.name)}</button><br><span class="small muted">To: ${esc(x.aud)} · ${audience(x).length} people</span></span><span></span></li>`).join("")}</ul></div>
    <div class="panel scanbox"><h2>${esc(t.name)}</h2><span class="small muted">${t.ch} to ${esc(t.aud)} · ${aud.length} recipient${aud.length===1?"":"s"}</span>
      ${ex?`<div class="note" style="white-space:pre-wrap;color:var(--fg);background:var(--sunk)">${esc(fill(t,ex))}</div><span class="small muted">Preview for ${esc(ex.m?ex.m.name:ex.c.name)}</span>`:`<div class="note">Nobody matches this audience yet.</div>`}
      ${t.ch==="SMS"?`<p class="note" style="margin:0">Texts go out only after the Valley's number is registered with the carriers, and only to members who opted in.</p>`:""}
      <button class="btn primary" id="queueBtn" ${aud.length?"":"disabled"} style="align-self:flex-start">Queue for officer approval</button></div></div>
  <div class="panel"><h2>Waiting for approval</h2>${S.queue.length?`<ul class="log">${S.queue.slice(0,12).map(q=>`<li><time>${when(q.t)}</time> · ${esc(q.tpl)} (${q.ch}) to ${esc(q.to)} · <span class="muted">waiting for an officer</span></li>`).join("")}</ul>`:`<p class="muted small" style="margin:0">Nothing queued. Confirming a cast member or signing up a candidate queues their message here.</p>`}
  <p class="note" style="margin-top:10px">Demo: nothing is sent from this page. In the live system an officer approves each batch, and the messages go out from the Valley's own account with their name and reply address.</p></div>`;
  el.querySelectorAll("[data-tpl]").forEach(b=>b.onclick=()=>{mSel=b.dataset.tpl;render()});
  $("#queueBtn").onclick=()=>{S.queue.unshift({t:Date.now(),tpl:t.name,to:aud.length+" recipients",ch:t.ch});save();render();toast(t.name+" queued for approval · nothing sent")};
}

/* ---------- boot ---------- */
const h=(location.hash||"").replace("#","");
if(VIEWS.some(v=>v[0]===h)) view=h;
render();
})();
</script>
