<title>Valley Production Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: CRM app shell — dark nav rail + work area; every view is a working screen over one shared demo dataset */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --fg:#171a21; --muted:#5b6170; --line:#dde0e7;
  --nav:#161a22; --nav-fg:#c9cdd6; --nav-active:#ffffff;
  --accent:#7a2445; --accent-fg:#ffffff; --accent-soft:#f4e6ec;
  --ok:#1f7a4a; --ok-soft:#e2f2e9; --warn:#9a6200; --warn-soft:#fbefd8; --info:#1f5fae; --info-soft:#e3edf9;
  --clean:#6a46a8; --clean-soft:#eee7f8; --bad:#b3261e; --bad-soft:#fbe5e3; --off:#6d7280; --off-soft:#eceef2;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1116; --surface:#171a21; --sunk:#1d2129; --fg:#e6e8ee; --muted:#9aa1b0; --line:#2a2f3a;
  --nav:#0a0c10; --nav-fg:#a7adba; --nav-active:#ffffff;
  --accent:#d0638b; --accent-fg:#14070c; --accent-soft:#3a1b27;
  --ok:#5fcf8f; --ok-soft:#173326; --warn:#e8b45a; --warn-soft:#3a2c12; --info:#7fb2f0; --info-soft:#16283f;
  --clean:#b49cf0; --clean-soft:#2a2140; --bad:#f08a80; --bad-soft:#3d1a18; --off:#9aa1b0; --off-soft:#232730; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1116; --surface:#171a21; --sunk:#1d2129; --fg:#e6e8ee; --muted:#9aa1b0; --line:#2a2f3a;
  --nav:#0a0c10; --nav-fg:#a7adba; --nav-active:#ffffff;
  --accent:#d0638b; --accent-fg:#14070c; --accent-soft:#3a1b27;
  --ok:#5fcf8f; --ok-soft:#173326; --warn:#e8b45a; --warn-soft:#3a2c12; --info:#7fb2f0; --info-soft:#16283f;
  --clean:#b49cf0; --clean-soft:#2a2140; --bad:#f08a80; --bad-soft:#3d1a18; --off:#9aa1b0; --off-soft:#232730; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
label.cam{position:relative;overflow:hidden;cursor:pointer;justify-content:center;align-self:flex-start}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.code{font-family:var(--mono);font-size:.86em;letter-spacing:.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* nav */
.nav{background:var(--nav);color:var(--nav-fg);display:flex;flex-direction:column;gap:18px;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{color:var(--nav-active);font-weight:800;letter-spacing:.02em;font-size:18px}
.brand span{font-size:12px;line-height:1.35}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:6px;display:flex;gap:10px;align-items:center;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--nav-active)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .foot{margin-top:auto;font-size:12px;line-height:1.45;padding:0 6px;display:flex;flex-direction:column;gap:8px}
.nav .foot button{width:auto;padding:6px 10px;border:1px solid rgba(255,255,255,.18);font-size:12.5px}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;padding-inline:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.demo{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.view{padding-inline:24px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 10px;font-weight:700}
.panel h3{font-size:13px;margin:0 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.tile{display:flex;flex-direction:column;gap:2px}
.tile .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{color:var(--muted);font-size:13px}
.tile.alert .n{color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 10px}
/* status chips */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Ready{background:var(--ok-soft);color:var(--ok)}
.st-Pulled{background:var(--warn-soft);color:var(--warn)}
.st-In-use{background:var(--info-soft);color:var(--info)}
.st-Cleaning{background:var(--clean-soft);color:var(--clean)}
.st-Repair{background:var(--bad-soft);color:var(--bad)}
.st-Retired{background:var(--off-soft);color:var(--off)}
.hv{display:inline-flex;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--accent);color:var(--accent-fg)}
.flag{display:inline-flex;font-size:11px;font-weight:800;padding:2px 6px;border-radius:4px;background:var(--bad);color:#fff}
/* bars */
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:9px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type="search"],input[type="text"],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type="search"]{flex:1 1 220px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);z-index:21;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header h2{margin:0;font-size:18px}
.drawer .body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.log li{border-left:2px solid var(--line);padding-left:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
/* scan */
.scanbox{display:flex;flex-direction:column;gap:12px}
.scanfield{display:flex;gap:8px}
.scanfield input{flex:1;font-family:var(--mono);font-size:18px;padding:12px 14px;letter-spacing:.04em}
.itemcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.itemcard.hv-card{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.itemcard h2{margin:0;font-size:20px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 8px}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0;display:flex;flex-wrap:wrap;gap:8px 16px}
legend{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
label.opt{display:inline-flex;gap:6px;align-items:center;font-size:14px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.card b{font-size:14px}
.card .row{gap:4px}
.card .btn{padding:3px 8px;font-size:12.5px}
.pull li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.pull{list-style:none;margin:0;padding:0}
.pull li:first-child{border-top:0}
.gap{color:var(--bad);font-weight:700;font-size:12px}
/* guide + stage */
.stagewrap{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunk);aspect-ratio:16/10;max-width:100%}
.stagewrap canvas{display:block;width:100%;height:100%}
.loading3d{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:16px}
.pick-row{cursor:pointer;border-radius:6px;padding-inline:6px}
.pick-row:hover{background:var(--sunk)}
.pick-row.on{background:var(--accent-soft)}
@media (min-width:981px){.sticky3d{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));align-self:start}}
.cardslot{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:2;background:var(--surface)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:8px;border-radius:6px;border:1px solid transparent;counter-increment:s;cursor:pointer}
.steps li::before{content:counter(s);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.steps li.on{background:var(--accent-soft);border-color:var(--accent)}
.steps li.on::before{color:var(--accent)}
.steps li.future{opacity:.55}
input[type="range"]{width:100%;accent-color:var(--accent)}
/* labels */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.label{background:#fff;color:#111;border:1px dashed #b9bdc7;border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.label .qr{width:104px;height:104px;display:grid;place-items:center}
.label .qr img,.label .qr canvas{width:104px!important;height:104px!important}
.label b{font-family:var(--mono);font-size:12px}
.label span{font-size:11.5px;line-height:1.3}
/* crew app (phone) */
.phonewrap{display:flex;justify-content:center;padding-block:8px 24px}
.phone{width:390px;max-width:100%;height:780px;max-height:calc(100vh - 140px);min-height:560px;border:10px solid #0b0d12;border-radius:40px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.phone .ptop{padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.phone .ptop b{font-size:17px}
.phone .pbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.phone .ptabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--surface)}
.phone .ptabs button{border:0;background:none;padding:8px 2px 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.phone .ptabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.phone .ptabs button[aria-current="page"]{color:var(--accent)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pcard h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.phone .ptop{flex-direction:row;align-items:center;gap:10px}
.pav{width:38px;height:38px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.ppts{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:4px 8px;border-radius:999px;white-space:nowrap}
.pback{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:2px 0;cursor:pointer}
.p3d{position:relative;height:280px;flex:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk)}
.p3d canvas{display:block;width:100%;height:100%;touch-action:none}
.pseg{display:flex}.pseg button{flex:1}
.ploc{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);border-radius:8px;padding:8px 10px}
.ploc svg{width:20px;height:20px;flex:none;stroke:var(--accent);fill:none;stroke-width:2;margin-top:2px}
.prow1{flex-direction:row;align-items:center;justify-content:space-between}
.pbar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}.pbar span{display:block;height:100%;background:var(--accent)}
.prole{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
.prole:hover{background:var(--sunk)}
.pscan{align-items:center;text-align:center;padding:18px 12px}.pscan>svg{width:40px;height:40px;stroke:var(--accent);fill:none;stroke-width:1.6}
.pscan label.cam{align-self:stretch;padding-block:12px;font-size:15px}
@media (max-width:760px){.phone{border:0;border-radius:0;height:auto;max-height:none;min-height:calc(100vh - 120px);box-shadow:none;width:100%}.phonewrap{padding:0}}
/* intercom */
.ic{display:flex;flex-direction:column;gap:10px;min-height:0}
.ic .chans{display:flex;gap:6px;flex-wrap:wrap}
.ic .chans button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.ic .chans button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ic .feed{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:10px;max-height:320px;min-height:160px;overflow-y:auto}
.ic .feed li{background:var(--surface);border-radius:10px;padding:8px 10px;max-width:88%;font-size:14px}
.ic .feed li.me{align-self:flex-end;background:var(--accent-soft)}
.ic .feed li .who{font-size:12px;color:var(--muted);font-weight:600}
.ic .quick button{font-family:var(--sans);font-size:13px;text-align:left}
.ic .ptt{width:100%;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-fg);touch-action:none;user-select:none;-webkit-user-select:none}
.ic .ptt.tx{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.2)}}
.ic .live{font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.ic .live i{width:8px;height:8px;border-radius:50%;background:var(--off);display:inline-block}
.ic .live.on i{background:var(--ok)}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
/* responsive */
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;overflow-x:auto;z-index:10}
  .brand span,.nav .foot{display:none}
  .nav ul{flex-direction:row;gap:2px}
  .nav button{padding:7px 9px;white-space:nowrap;font-size:13px}
  .nav button .t{display:none}
  .nav button[aria-current="page"] .t{display:inline}
  .top{position:static;padding-inline:16px}
  .view{padding-inline:16px}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tile .n{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="nav" aria-label="Main">
    <div class="brand"><b>vyntec</b><span>Production Operations<br>prepared for the Valley of Orlando</span></div>
    <ul id="navlist"></ul>
    <div class="foot">
      <span>Demo by vyntec with sample data. Not an official Valley of Orlando page. In the live system this runs inside the Valley's own link.vyntec.co account.</span>
      <button type="button" id="resetBtn">Reset demo data</button>
    </div>
  </nav>
  <div class="main">
    <div class="top">
      <h1 id="viewTitle">Dashboard</h1>
      <span class="pill demo">DEMO · sample data</span>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Screen" id="modeSeg">
        <button type="button" data-mode="office" aria-pressed="true">Office view</button>
        <button type="button" data-mode="crew" aria-pressed="false">Crew app</button>
      </div>
      <select id="personaSel" aria-label="Crew member" hidden></select>
      <span class="small muted" id="viewingLbl">Viewing as</span>
      <div class="seg" role="group" aria-label="Crew view" id="crewSeg">
        <button type="button" data-crew="All" aria-pressed="true">Officers</button>
        <button type="button" data-crew="Wardrobe" aria-pressed="false">Wardrobe crew</button>
        <button type="button" data-crew="Props" aria-pressed="false">Props crew</button>
      </div>
    </div>
    <main id="view" class="view"></main>
  </div>

function bindActions(root,i,after){
  root.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{
    const a=b.dataset.a, p=root.id==="drawerHost"?"d":"s";
    if(a==="pull"){
      if(i.high&&!$("#"+p+"lead",root).checked){toast("High-value: the wardrobe lead must sign this mask out");return}
      const pr=S.productions.find(x=>x.id===$("#"+p+"prod",root).value);
      act(i,"Pulled",`Pulled for ${pr?pr.name+" · "+pr.degree:"production"}`+(i.high?" · signed out by the wardrobe lead":""));toast(i.code+" pulled");
    }else if(a==="use"){act(i,"In use","Dressed / on stage");toast(i.code+" in use")}
    else if(a==="back"){act(i,"Ready","Put back unused");toast(i.code+" back on the shelf")}
    else if(a==="return"){
      if(i.high&&!$("#"+p+"photo",root).checked){toast("High-value: take and check the return photo first");return}
      const c=root.querySelector(`input[name="${p}cond"]:checked`).value, note=$("#"+p+"note",root).value.trim();
      const map={ok:["Ready","Good"],clean:["Cleaning","Needs cleaning"],repair:["Repair",note||"Needs repair"]};
      i.condition=map[c][1]; act(i,map[c][0],"Returned · "+map[c][1]+(note&&c!=="repair"?" · "+note:"")+(i.high?" · return photo checked":""));
      toast(map[c][0]==="Ready"?i.code+" returned and ready":i.code+" returned, now "+map[c][0].toLowerCase());
    }else if(a==="ready"){i.condition="Good";act(i,"Ready",(i.status==="Cleaning"?"Cleaned":"Repaired")+", back to ready");toast(i.code+" ready")}
    else if(a==="retire"){act(i,"Retired","Retired from use");toast(i.code+" retired")}
    after();
  }));
}

/* shortcut: photo snap, not a live viewfinder (the artifact frame refuses live camera streams), upgrade when the demo runs top-level or in the platform app */
const camBtn=(label="Scan with camera")=>`<label class="btn primary cam">${label}<input type="file" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden"></label>`;
function bindCam(root,onCode){
  root.querySelectorAll("label.cam input").forEach(inp=>inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0]; inp.value=""; if(!f) return;
    if(typeof jsQR!=="function"){toast("The QR reader didn't load. Type the code instead.");return}
    const img=new Image(), url=URL.createObjectURL(f);
    img.onload=()=>{URL.revokeObjectURL(url);
      const k=Math.min(1,1024/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      const x=c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height);
      const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
      if(r&&r.data) onCode(r.data.trim()); else toast("No QR code found in that photo. Fill the frame with the tag and try again.")};
    img.onerror=()=>{URL.revokeObjectURL(url);toast("Couldn't read that photo.")};
    img.src=url}));
}

/* ---------- 3D helpers ---------- */
let loops=[];
function stopLoops(){loops.forEach(f=>f());loops=[]}
function have3d(){return typeof THREE!=="undefined"&&THREE.OrbitControls}
function makeRenderer(wrap){
  const r=new THREE.WebGLRenderer({antialias:true,alpha:false});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

  return r;
}
function sizeTo(wrap,r,cam){const w=wrap.clientWidth,h=wrap.clientHeight||w*.62;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
function hexOf(v){return new THREE.Color(cssv(v)||"#888")}

let gDeg="32°", gRole=0, gStep=99;

     <select id="gDeg" aria-label="Degree">${Object.keys(KITS).map(d=>`<option ${d===gDeg?"selected":""}>${d}</option>`).join("")}</select>

       <input type="range" id="gStep" min="0" max="${pieces.length}" value="${gStep}">
       <ol class="steps" id="gSteps">${pieces.map((i,k)=>`<li data-step="${k+1}" class="${k+1===gStep?"on":k+1>gStep?"future":""}"><span><b>${esc(i.name)}</b> <button class="btn" style="padding:0 6px;font-size:12px" data-open="${i.code}">${i.code}</button> ${i.high?'<span class="hv">HIGH VALUE</span>':""}<br><span class="small">${esc(DRESS[i.type]||"Dress as shown.")}</span><br><span class="small muted">From ${esc(i.location)} · size ${esc(i.size)} · ${chip(i.status)}</span> <button class="btn" style="padding:0 6px;font-size:12px" data-room="${i.code}">Show in room</button></span></li>`).join("")}</ol>
       <p class="note" style="margin-top:12px">In the live system each role is a lesson in the Valley's private Wardrobe & Props Guide course, with front, back and side photos of the real costume and a 360° phone video.</p>
     </div></div>`;
  $("#gDeg").onchange=e=>{gDeg=e.target.value;gRole=0;gStep=99;render()};

/* the dressed mannequin; reused by the dressing guide and the crew app */
function mountDress(wrap,pieces,step,focus){
  const scene=new THREE.Scene(); scene.background=hexOf("--sunk");
  const cam=new THREE.PerspectiveCamera(35,1.6,.1,100); cam.position.set(0,1.6,6.2);
  const r=makeRenderer(wrap); sizeTo(wrap,r,cam);
  const ctl=new THREE.OrbitControls(cam,r.domElement); ctl.target.set(0,1.15,0); ctl.enablePan=false; ctl.minDistance=3; ctl.maxDistance=9; ctl.autoRotate=!matchMedia("(prefers-reduced-motion: reduce)").matches; ctl.autoRotateSpeed=1.4; ctl.update();
  scene.add(new THREE.HemisphereLight(0xffffff,0x444455,.9)); const dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(3,5,4); scene.add(dl);
  const skin=new THREE.MeshStandardMaterial({color:0xc9b8a6,roughness:.9});
  const add=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o};
  // mannequin
  add(new THREE.CylinderGeometry(.6,.6,.06,32),new THREE.MeshStandardMaterial({color:0x555b66}),0,.03,0);
  add(new THREE.SphereGeometry(.2,24,16),skin,0,2.12,0);
  add(new THREE.CylinderGeometry(.08,.09,.14,16),skin,0,1.92,0);
  add(new THREE.CylinderGeometry(.27,.22,.85,24),skin,0,1.45,0);
  add(new THREE.CylinderGeometry(.22,.2,.25,24),skin,0,.95,0);
  [-.11,.11].forEach(x=>add(new THREE.CylinderGeometry(.075,.065,.82,12),skin,x,.43,0));
  [-.36,.36].forEach(x=>{const a=add(new THREE.CylinderGeometry(.055,.05,.78,12),skin,x,1.42,0);a.rotation.z=x>0?.18:-.18});
  const col={Robe:0x1d1f26,Tunic:0xeeeeea,Coat:0x2a2f48,Cape:0x8e1b2c,Sash:0x2f5fb3,Collar:0xc9a227,Gloves:0xf2f2ee,Footwear:0x6b4a2b,Headpiece:0x7a5a1e,Mask:0xd8c36a};
  const mat=t=>new THREE.MeshStandardMaterial({color:col[t]||0x888888,roughness:.7,metalness:t==="Collar"||t==="Mask"?.45:0,side:THREE.DoubleSide});
  const build=(i)=>{
    const g=new THREE.Group(); const m=mat(i.type);
    const put=(geo,x,y,z,rx=0,rz=0)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.rotation.x=rx;o.rotation.z=rz;g.add(o)};
    switch(i.type){
      case "Robe":case "Tunic":case "Coat":{const len=i.type==="Tunic"?1.0:1.75;put(new THREE.CylinderGeometry(.3,i.type==="Tunic"?.36:.48,len,32,1,true),0,1.86-len/2,0);[-.37,.37].forEach(x=>put(new THREE.CylinderGeometry(.075,.1,.62,12),x,1.52,0,0,x>0?.18:-.18));break}
      case "Cape":put(new THREE.CylinderGeometry(.34,.62,1.5,32,1,true,Math.PI*.15,Math.PI*1.7),0,1.15,-.02);break;
      case "Sash":{const s=new THREE.BoxGeometry(.13,1.05,.36);put(s,0,1.45,0,0,-.62);break}
      case "Collar":put(new THREE.TorusGeometry(.24,.05,10,32),0,1.86,0,Math.PI/2);put(new THREE.ConeGeometry(.09,.22,4),0,1.68,.27,Math.PI);break;
      case "Gloves":[-.44,.44].forEach(x=>put(new THREE.SphereGeometry(.075,12,10),x,1.02,0));break;
      case "Footwear":[-.11,.11].forEach(x=>put(new THREE.BoxGeometry(.14,.07,.3),x,.07,.05));break;
      case "Headpiece":put(new THREE.CylinderGeometry(.19,.22,.26,24),0,2.33,0);put(new THREE.TorusGeometry(.215,.025,8,32),0,2.22,0,Math.PI/2);break;

      box(.08,.18,.06,M(0xc9a227,{metalness:.8,roughness:.3}),R.x+.6,1.0,R.z+.4); sign("LOCKED · masks",R.x,2.3,R.z);
      list.forEach((i,k)=>{const x=R.x-.4+k*.8, isOut=i.status==="Pulled"||i.status==="In use";box(.08,.5,.08,M(0x222222),x,.75,R.z);const m=add(new THREE.SphereGeometry(.2,20,14,-Math.PI*.4,Math.PI*.8),isOut?outMat:M(col.Mask,{metalness:.5,roughness:.35}),x,1.15,R.z+.05);box(.1,.05,.02,tagOf(i),x,.9,R.z+.32);reg(i,m,x,1.1,R.z,.3,.7)});
    }
  });
  const selRing=add(new THREE.TorusGeometry(.4,.04,8,40),M(0xe0c48a,{emissive:0xe0c48a,emissiveIntensity:.8}),0,0,0); selRing.rotation.x=Math.PI/2; selRing.visible=false;
  let sel=null;
  const hl=code=>{Object.values(meshes).forEach(o=>o.scale.setScalar(1));sel=meshes[code]||null;selRing.visible=!!sel;if(sel){sel.scale.setScalar(1.12);selRing.position.set(sel.position.x,.03,sel.position.z);if(zoom){ctl.target.set(sel.position.x,1.1,sel.position.z);cam.position.set(sel.position.x*.85,3.4,sel.position.z+(sel.position.z<0?5.2:4.6));ctl.update();signs.forEach(sp=>sp.visible=sp.position.distanceTo(cam.position)>4.5)}}};
  const ray=new THREE.Raycaster(), v=new THREE.Vector2();
  const pick=e=>{const b=r.domElement.getBoundingClientRect();v.x=((e.clientX-b.left)/b.width)*2-1;v.y=-((e.clientY-b.top)/b.height)*2+1;ray.setFromCamera(v,cam);const h=ray.intersectObjects(hits.concat(Object.values(meshes)),true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.code)o=o.parent;return o?o.userData.code:null};
  let down=null;
  r.domElement.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY}},true);
  r.domElement.addEventListener("pointerup",e=>{if(!down)return;const mv=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(mv>6)return;const c=pick(e);if(c){hl(c);onPick(c)}},true);
  r.domElement.addEventListener("pointermove",e=>{if(e.buttons)return;r.domElement.style.cursor=pick(e)?"pointer":"grab"});
  let raf=0,alive=true,t0=performance.now();const tick=()=>{if(!alive)return;ctl.update();if(sel)selRing.scale.setScalar(1+.08*Math.sin((performance.now()-t0)/250));r.render(scene,cam);raf=requestAnimationFrame(tick)};tick();
  const ro=new ResizeObserver(()=>sizeTo(wrap,r,cam)); ro.observe(wrap);
  loops.push(()=>{alive=false;cancelAnimationFrame(raf);ro.disconnect();ctl.dispose();r.dispose()});
  return hl;
}

/* ---------- intercom (live between open devices via the room capability) ---------- */
const CHANNELS=[["all","All crew"],["wardrobe","Wardrobe"],["props","Props"],["stage","Stage manager"]];
const QUICK={all:["Crew call in 10 minutes","Lunch break, back at 1:30","End-of-day check starting"],wardrobe:["Need a size XL robe at stage left","Mask needed for the 32°, lead please bring it","Costume repair needed in the dressing room"],props:["Lantern missing for scene 2","Set the throne chair upstage","Props reset complete"],stage:["Places in five minutes","Hold, hold, hold","Scene change, go"]};
const SIM={wardrobe:"Copy. On my way with it.",props:"Copy, props has it.",stage:"Copy, standing by.",all:"Copy that."};
const PERSONAS=[{id:"MBR-005",role:"Wardrobe crew",ch:"wardrobe"},{id:"MBR-003",role:"Props crew",ch:"props"},{id:"MBR-001",role:"Cast",ch:"all"},{id:"SM",name:"Stage manager (sample)",role:"Stage manager",ch:"stage"}];
let mode="office", personaId="MBR-005", pTab="today";
const persona=()=>PERSONAS.find(x=>x.id===personaId)||PERSONAS[0];
const pname=pp=>pp.name||(mem(pp.id)||{}).name||"Crew member";
const RADIO={room:null,live:false,peers:[],ch:"wardrobe",dm:null,msgs:[],muted:false,listeners:new Set()};
function radioMe(){ if(mode==="crew"){const pp=persona();return {name:pname(pp),role:pp.role}} return {name:"Officer (demo)",role:"Office"} }
function radioPush(m){RADIO.msgs.push(m);RADIO.msgs=RADIO.msgs.slice(-80);RADIO.listeners.forEach(f=>f())}
function chirp(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=1200;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12);setTimeout(()=>a.close(),300)}catch(e){}}
function speak(text){if(RADIO.muted)return;chirp();try{const u=new SpeechSynthesisUtterance(text);u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
const clean=(v,n)=>String(v==null?"":v).replace(/[\u0000-\u001f]/g," ").slice(0,n);
function radioSend(text){
  text=clean(text,200).trim(); if(!text) return;
  const me=radioMe(), m={t:Date.now(),ch:RADIO.dm?"dm":RADIO.ch,to:RADIO.dm||"",from:me.name,role:me.role,text,me:true};
  radioPush(m);

    body.innerHTML=`<div class="pcard pscan"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.scan}</svg><b>Scan a tag</b><span class="small muted">Snap the QR on the tag. The piece opens with where it lives and how it's worn.</span>${camBtn("Open camera")}</div>
      <div class="pcard"><h3>Or type the code</h3><form class="scanfield" id="pScanF"><input id="pScanI" autocomplete="off" placeholder="DEMO-WR-001" aria-label="Item code"><button class="btn primary">Find</button></form>
      <span class="small muted">Demo: tap a tag to simulate a scan</span><div class="quick">${S.items.filter(i=>i.dept===dept).map(i=>`<button type="button" data-pscan="${i.code}">${i.code.replace("DEMO-","")}</button>`).join("")}</div></div><div id="pScanOut"></div>`;
    const show=code=>{const i=item(String(code).trim().toUpperCase()),out=$("#pScanOut",body);
      if(!i){out.innerHTML=`<div class="banner bad">No piece with that code.</div>`;return}
      if(i.dept!==dept){out.innerHTML=`<div class="banner bad">${i.code} belongs to the ${i.dept} crew.</div>`;return}
      openSheet({kind:"item",code:i.code})};
    $("#pScanF",body).addEventListener("submit",e=>{e.preventDefault();show($("#pScanI",body).value)});
    bindCam(body,show);
    body.querySelectorAll("[data-pscan]").forEach(b=>b.onclick=()=>show(b.dataset.pscan));
  } else if(pTab==="kit"){
    if(isCast){
      const slot=m&&S.slots.find(x=>x.member===m.id&&x.status!=="Open");
      if(!slot){body.innerHTML=`<div class="pcard"><span class="small">No role yet. Sign up for an open role on the Today tab.</span></div>`}
      else{const p=S.productions.find(x=>x.id===slot.prod); roleSheet(body,p.degree,slot.role,{back:false})}
    } else if(isSM){
      body.innerHTML=S.productions.map(p=>`<div class="pcard"><b>${esc(p.name)} · ${p.degree}</b><div class="row">${chip(p.stage==="Reset"?"Ready":p.stage==="Planning"?"Retired":"In use").replace(/>[^<]*<\/span>$/,">"+esc(p.stage)+"</span>")}${gaps(p).length?`<span class="gap">${gaps(p).length} kit gap</span>`:""}</div><span class="small muted">${S.slots.filter(x=>x.prod===p.id&&x.member).length}/${S.slots.filter(x=>x.prod===p.id).length} cast</span></div>`).join("");
    } else {
      const codes=kitCodes(nextProd).filter(c=>item(c).dept===dept);
      body.innerHTML=`<div class="pcard"><h3>${esc(nextProd.name)} · ${nextProd.degree}</h3><span class="small muted">Tap a piece to see where it is${dept==="Wardrobe"?" and how it's worn":" and where it goes on stage"}.</span><ul class="pull">${pullRows(codes)||'<li class="small muted">Nothing for your crew in this production.</li>'}</ul></div>${dept==="Wardrobe"?roleList():""}`;
      bindRows();
    }
  } else if(pTab==="radio"){
    intercomPanel(body);
  } else if(pTab==="points"&&m){
    const lvl=m.points>=60?"Gold":m.points>=30?"Silver":"Bronze";
    body.innerHTML=`<div class="pcard"><h3>Your volunteer points</h3><span style="font-size:34px;font-weight:800;font-variant-numeric:tabular-nums">${m.points}</span><span class="small">${lvl} level · rank ${[...S.members].sort((a,b)=>b.points-a.points).findIndex(x=>x.id===m.id)+1} of ${S.members.length}</span></div>
      <div class="pcard"><h3>History</h3><ul class="log">${m.log.slice(0,8).map(l=>`<li><time>${when(l.t)}</time> · <b>+${l.pts}</b> ${esc(l.text)}</li>`).join("")}</ul></div>`;
  }
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-mode]");if(!b)return;mode=b.dataset.mode;document.querySelectorAll("#modeSeg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));if(mode==="crew"){RADIO.ch=persona().ch;RADIO.dm=null}radioPresence();closeDrawer();render();window.scrollTo(0,0)});

/* ---------- boot ---------- */
const h=(location.hash||"").replace("#","");
if(VIEWS.some(v=>v[0]===h)) view=h;
render();
radioBoot();
})();
</script>
